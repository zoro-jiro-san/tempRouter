name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Installs all workspaces; root `prepare` builds @temprouter/sdk → dist.
      - name: Install
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Typecheck (all packages)
        run: npm run typecheck

      - name: Test
        run: npm test
